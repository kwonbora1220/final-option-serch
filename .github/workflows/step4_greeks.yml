name: STEP 4 - Greeks Engine

on:
  workflow_dispatch:

jobs:
  greeks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Normalized Data
        run: |
          echo "=========================================="
          echo "STEP 3 INPUT CHECK"
          echo "=========================================="

          ls -lh data/normalized/

          python -c "import pandas as pd; df=pd.read_csv('data/normalized/options_normalized.csv'); print('ROWS       :', len(df)); print('COLUMNS    :', len(df.columns)); print('TICKERS    :', df['symbol'].nunique()); print('DTE MIN    :', df['DTE'].min()); print('DTE MAX    :', df['DTE'].max())"

      - name: Run Greeks Engine
        run: |
          python src/04_greeks.py

      - name: Check Greeks Output
        run: |
          echo "=========================================="
          echo "STEP 4 OUTPUT CHECK"
          echo "=========================================="

          ls -lh data/analysis/

          python -c "import pandas as pd; df=pd.read_csv('data/analysis/options_greeks.csv'); print('ROWS       :', len(df)); print('COLUMNS    :', len(df.columns)); print('VALID DELTA:', df['delta'].notna().sum()); print('VALID GAMMA:', df['gamma'].notna().sum()); print('VALID VEGA :', df['vega'].notna().sum())"

      - name: Save Greeks Data To Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/analysis/options_greeks.csv

          git diff --cached --quiet || git commit -m "Add calculated option Greeks"

          git push

      - name: Upload Greeks Data
        uses: actions/upload-artifact@v4
        with:
          name: option-greeks-data
          path: data/analysis/options_greeks.csv
