name: STEP 4 - Greeks Engine

on:
  workflow_dispatch:

jobs:
  greeks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Normalized Data
        run: |
          echo "=========================================="
          echo "STEP 3 INPUT CHECK"
          echo "=========================================="

          ls -lh data/normalized/

          python -c "import pandas as pd; df=pd.read_csv('data/normalized/options_normalized.csv'); print('ROWS       :', len(df)); print('COLUMNS    :', len(df.columns)); print('TICKERS    :', df['symbol'].nunique()); print('DTE MIN    :', df['DTE'].min()); print('DTE MAX    :', df['DTE'].max())"

      - name: Run Greeks Engine
        run: |
          python src/04_greeks.py

      - name: Check Greeks Output
        run: |
          echo "=========================================="
          echo "STEP 4 OUTPUT CHECK"
          echo "=========================================="

          ls -lh data/analysis/

          python -c "import pandas as pd; df=pd.read_csv('data/analysis/options_greeks.csv'); print('ROWS       :', len(df)); print('COLUMNS    :', len(df.columns)); print('TICKERS    :', df['symbol'].nunique()); print('VALID DELTA:', df['delta'].notna().sum()); print('VALID GAMMA:', df['gamma'].notna().sum()); print('VALID VEGA :', df['vega'].notna().sum())"

      - name: Verify Greeks File Size
        run: |
          echo "=========================================="
          echo "STEP 4 FILE SIZE CHECK"
          echo "=========================================="

          ls -lh data/analysis/options_greeks.csv

          FILE_SIZE=$(stat -c%s data/analysis/options_greeks.csv)

          echo "GREEKS FILE SIZE : ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -ge 104857600 ]; then
            echo "WARNING: options_greeks.csv exceeds GitHub 100 MB file limit."
            echo "The file will NOT be committed to the repository."
          else
            echo "GREEKS FILE SIZE : UNDER 100 MB"
          fi

      - name: STEP 4 Complete
        run: |
          echo "=========================================="
          echo "STEP 4 COMPLETE"
          echo "=========================================="
          echo "Greeks calculation completed successfully."
          echo "options_greeks.csv will not be committed to GitHub."

