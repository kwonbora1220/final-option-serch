# ============================================================
# STEP 9 - DECISION
# ============================================================

- name: STEP 9 Input Check
  run: |
    echo "=========================================="
    echo "STEP 9 INPUT CHECK"
    echo "=========================================="

    echo ""
    echo "STEP 1 MARKET REGIME CHECK"
    echo "------------------------------------------"

    test -f data/analysis/market_regime.csv

    python - <<'PY'
    import pandas as pd

    file = "data/analysis/market_regime.csv"

    df = pd.read_csv(file)

    print("ROWS :", len(df))
    print("COLUMNS :", df.columns.tolist())

    required = [
        "market_score",
        "regime",
        "ndx_direction",
        "spy_direction",
        "soxx_direction",
        "dia_direction"
    ]

    for column in required:
        if column not in df.columns:
            raise ValueError(
                f"Missing column in market_regime.csv: {column}"
            )

    score = pd.to_numeric(
        df["market_score"],
        errors="coerce"
    ).iloc[-1]

    if pd.isna(score):
        raise ValueError(
            "market_score is invalid"
        )

    print("")
    print("MARKET SCORE :", score)
    print("REGIME :", df["regime"].iloc[-1])
    print("NDX :", df["ndx_direction"].iloc[-1])
    print("SPY :", df["spy_direction"].iloc[-1])
    print("SOXX :", df["soxx_direction"].iloc[-1])
    print("DIA :", df["dia_direction"].iloc[-1])

    print("")
    print("STEP 1 MARKET REGIME : OK")
    PY


    echo ""
    echo "=========================================="
    echo "STRUCTURE CHECK"
    echo "=========================================="

    test -f data/analysis/structure.csv

    python - <<'PY'
    import pandas as pd

    file = "data/analysis/structure.csv"

    df = pd.read_csv(file)

    print("ROWS :", len(df))
    print("COLUMNS :", df.columns.tolist())

    required = [
        "ticker",
        "current_price",
        "call_wall",
        "put_wall",
        "support",
        "resistance",
        "net_gex",
        "structure"
    ]

    for column in required:
        if column not in df.columns:
            raise ValueError(
                f"Missing column in structure.csv: {column}"
            )

    print("STRUCTURE : OK")
    PY


    echo ""
    echo "=========================================="
    echo "UNUSUAL FLOW CHECK"
    echo "=========================================="

    test -f data/analysis/unusual_flow.csv

    python - <<'PY'
    import pandas as pd

    file = "data/analysis/unusual_flow.csv"

    df = pd.read_csv(file)

    print("ROWS :", len(df))
    print("COLUMNS :", df.columns.tolist())

    if "ticker" not in df.columns:
        raise ValueError(
            "ticker column missing in unusual_flow.csv"
        )

    print("UNUSUAL FLOW : OK")
    PY


    echo ""
    echo "=========================================="
    echo "TOP20 CHECK"
    echo "=========================================="

    test -f data/analysis/top20.csv

    python - <<'PY'
    import pandas as pd

    file = "data/analysis/top20.csv"

    df = pd.read_csv(file)

    print("ROWS :", len(df))
    print("COLUMNS :", df.columns.tolist())

    if "ticker" not in df.columns:
        raise ValueError(
            "ticker column missing in top20.csv"
        )

    print("TOP20 : OK")
    PY


    echo ""
    echo "=========================================="
    echo "STEP 9 INPUT CHECK : OK"
    echo "=========================================="


- name: Run STEP 9 Decision
  run: |
    echo "=========================================="
    echo "STEP 9 DECISION"
    echo "=========================================="

    python 02_PROGRAM/09_decision.py


- name: STEP 9 Output Check
  run: |
    echo "=========================================="
    echo "STEP 9 OUTPUT CHECK"
    echo "=========================================="

    test -f data/analysis/decision.csv

    echo ""
    echo "DECISION FILE"
    echo "------------------------------------------"

    ls -lh data/analysis/decision.csv

    echo ""
    cat data/analysis/decision.csv

    echo ""
    echo "STEP 9 OUTPUT : OK"


- name: Save STEP 9 result to GitHub
  run: |
    echo "=========================================="
    echo "SAVE STEP 9 RESULT"
    echo "=========================================="

    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add data/analysis/decision.csv

    if git diff --cached --quiet; then
      echo "No changes to commit."
    else
      git commit -m "Add STEP 9 market stock decision"
      git push
    fi


- name: STEP 9 Complete
  run: |
    echo "=========================================="
    echo "🔥 STEP 9 DECISION COMPLETE"
    echo "=========================================="

    echo "decision.csv saved to:"
    echo "data/analysis/decision.csv"
