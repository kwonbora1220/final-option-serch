name: STEP 9 - Market Stock Decision

on:
  workflow_dispatch:

jobs:
  decision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: STEP 9 Input Check
        run: |
          echo "=========================================="
          echo "STEP 9 INPUT CHECK"
          echo "=========================================="

          test -f data/analysis/market_regime.csv
          test -f data/analysis/structure.csv
          test -f data/analysis/unusual_flow.csv
          test -f data/analysis/top20.csv

          echo ""
          echo "REQUIRED FILES"
          echo "------------------------------------------"

          ls -lh \
            data/analysis/market_regime.csv \
            data/analysis/structure.csv \
            data/analysis/unusual_flow.csv \
            data/analysis/top20.csv

          echo ""
          echo "INPUT FILES : OK"

      - name: STEP 1 Market Regime Check
        run: |
          echo "=========================================="
          echo "STEP 1 MARKET REGIME CHECK"
          echo "=========================================="

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/market_regime.csv"

          df = pd.read_csv(file)

          print(f"ROWS            : {len(df)}")
          print(f"TICKERS         : {df['ticker'].nunique()}")

          score = pd.to_numeric(
              df["market_score"],
              errors="coerce"
          ).dropna().iloc[-1]

          regime = str(
              df["market_regime"].dropna().iloc[-1]
          )

          print(f"MARKET SCORE    : {score:.2f} / 100")
          print(f"MARKET REGIME   : {regime}")

          if not 0 <= score <= 100:
              raise ValueError(
                  f"Invalid market score: {score}"
              )

          print("")
          print("STEP 1 MARKET DATA : OK")
          PY

      - name: Run Decision Engine
        run: |
          echo "=========================================="
          echo "STEP 9 DECISION ENGINE"
          echo "=========================================="

          python src/09_decision.py

      - name: STEP 9 Output Check
        run: |
          echo "=========================================="
          echo "STEP 9 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/decision.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/decision.csv"

          df = pd.read_csv(file)

          print(f"ROWS             : {len(df)}")
          print(f"TICKERS          : {df['ticker'].nunique()}")

          print(
              "MARKET SCORE      :",
              df["market_score"].iloc[0]
          )

          print(
              "MARKET REGIME     :",
              df["market_regime"].iloc[0]
          )

          print(
              "SCORE VALID       :",
              df["decision_score"].notna().sum()
          )

          print(
              "DECISION VALID    :",
              df["decision"].notna().sum()
          )

          print()
          print("DECISION COUNTS")
          print("------------------------------------------")

          print(
              df["decision"].value_counts()
          )

          print()
          print("STEP 9 OUTPUT : OK")
          print("==========================================")
          PY

      - name: Save STEP 9 result to GitHub
        run: |
          echo "=========================================="
          echo "SAVE STEP 9 RESULT"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/analysis/decision.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add STEP 9 market stock decision"
            git push
          fi

      - name: STEP 9 Complete
        run: |
          echo "=========================================="
          echo "🔥 STEP 9 MARKET STOCK DECISION COMPLETE"
          echo "=========================================="

          echo "decision.csv saved to:"
          echo "data/analysis/decision.csv"
