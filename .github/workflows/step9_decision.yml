
name: STEP 9 Decision

on:
  workflow_dispatch:
  push:
    paths:
      - "src/09_decision.py"
      - "data/analysis/market_regime.csv"
      - "data/analysis/structure.csv"
      - "data/analysis/unusual_flow.csv"
      - "data/analysis/top20.csv"
      - ".github/workflows/step9_decision.yml"

permissions:
  contents: write

jobs:
  decision:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # STEP 9 INPUT CHECK
      # ============================================================

      - name: STEP 9 Input Check
        run: |
          echo "=========================================="
          echo "STEP 9 INPUT CHECK"
          echo "=========================================="

          echo ""
          echo "CURRENT DIRECTORY"
          pwd

          echo ""
          echo "REPOSITORY FILES"
          ls -la

          echo ""
          echo "SRC DIRECTORY"
          ls -la src || true

          echo ""
          echo "ANALYSIS DIRECTORY"
          ls -la data/analysis || true

          echo ""
          echo "=========================================="
          echo "REQUIRED FILES"
          echo "=========================================="

          test -f data/analysis/market_regime.csv
          test -f data/analysis/structure.csv
          test -f data/analysis/unusual_flow.csv
          test -f data/analysis/top20.csv
          test -f src/09_decision.py

          echo ""
          echo "STEP 1 MARKET REGIME"
          echo "------------------------------------------"
          cat data/analysis/market_regime.csv

          echo ""
          echo "STEP 8 STRUCTURE"
          echo "------------------------------------------"
          head -10 data/analysis/structure.csv

          echo ""
          echo "UNUSUAL FLOW"
          echo "------------------------------------------"
          head -10 data/analysis/unusual_flow.csv

          echo ""
          echo "TOP20"
          echo "------------------------------------------"
          head -10 data/analysis/top20.csv

          echo ""
          echo "STEP 9 INPUT CHECK : OK"

      # ============================================================
      # RUN STEP 9
      # ============================================================

      - name: Run STEP 9 Decision
        run: |
          echo "=========================================="
          echo "STEP 9 DECISION"
          echo "=========================================="

          python src/09_decision.py

      # ============================================================
      # STEP 9 OUTPUT CHECK
      # ============================================================

      - name: STEP 9 Output Check
        run: |
          echo "=========================================="
          echo "STEP 9 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/decision.csv

          echo ""
          echo "DECISION FILE"
          echo "------------------------------------------"

          ls -lh data/analysis/decision.csv

          echo ""
          echo "DECISION CONTENT"
          echo "------------------------------------------"

          cat data/analysis/decision.csv

          echo ""
          echo "STEP 9 OUTPUT : OK"

      # ============================================================
      # VALIDATION
      # ============================================================

      - name: STEP 9 Validation
        run: |
          echo "=========================================="
          echo "STEP 9 VALIDATION"
          echo "=========================================="

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/decision.csv"

          df = pd.read_csv(file)

          print("ROWS :", len(df))
          print("COLUMNS :", list(df.columns))

          required = [
              "ticker",
              "decision_score",
              "decision"
          ]

          for column in required:
              if column not in df.columns:
                  raise RuntimeError(
                      f"Required column missing: {column}"
                  )

          print("")
          print("DECISION SUMMARY")
          print("------------------------------------------")

          if "decision" in df.columns:
              print(df["decision"].value_counts(dropna=False))

          print("")
          print("TOP DECISIONS")
          print("------------------------------------------")

          columns = [
              column
              for column in [
                  "final_rank",
                  "rank",
                  "ticker",
                  "market_score",
                  "flow_score",
                  "decision_score",
                  "decision"
              ]
              if column in df.columns
          ]

          print(
              df[columns]
              .head(20)
              .to_string(index=False)
          )

          print("")
          print("STEP 9 VALIDATION : OK")
          PY

      # ============================================================
      # SAVE RESULT
      # ============================================================

      - name: Save STEP 9 result to GitHub
        run: |
          echo "=========================================="
          echo "SAVE STEP 9 RESULT"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/analysis/decision.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix STEP 9 decision workflow path"
            git push
          fi

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: STEP 9 Complete
        run: |
          echo "=========================================="
          echo "🔥 STEP 9 DECISION COMPLETE"
          echo "=========================================="

          echo ""
          echo "decision.csv saved to:"
          echo "data/analysis/decision.csv"

          echo ""
          echo "STEP 9 STATUS : SUCCESS"
