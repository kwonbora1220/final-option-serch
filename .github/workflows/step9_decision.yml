
name: STEP 9 - Market Stock Decision

on:
  workflow_dispatch:

jobs:
  decision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check STEP 9 inputs
        run: |
          echo "=========================================="
          echo "STEP 9 INPUT CHECK"
          echo "=========================================="

          test -f data/analysis/structure.csv
          test -f data/analysis/unusual_flow.csv
          test -f data/analysis/top20.csv

          ls -lh data/analysis/

          echo "INPUT FILES : OK"

      - name: Run Decision Engine
        run: |
          python src/09_decision.py

      - name: Check STEP 9 output
        run: |
          echo "=========================================="
          echo "STEP 9 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/decision.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/decision.csv"

          df = pd.read_csv(file)

          print(f"ROWS             : {len(df)}")
          print(f"TICKERS          : {df['ticker'].nunique()}")

          print(
              "SCORE VALID       :",
              df["decision_score"].notna().sum()
          )

          print(
              "DECISION VALID    :",
              df["decision"].notna().sum()
          )

          print()
          print("DECISION COUNTS")

          print(
              df["decision"].value_counts()
          )

          print()
          print("STEP 9 OUTPUT : OK")
          PY

      - name: Upload STEP 9 decision
        uses: actions/upload-artifact@v4
        with:
          name: option-decision
          path: data/analysis/decision.csv

