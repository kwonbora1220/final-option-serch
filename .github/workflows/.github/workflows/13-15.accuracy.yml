name: STEP 13-15 - Accuracy Validation

on:

  workflow_dispatch:

  schedule:
    - cron: "0 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: option-scanner-accuracy
  cancel-in-progress: false


jobs:

  accuracy-validation:

    runs-on: ubuntu-latest


    steps:


      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          persist-credentials: true


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |

          set -e

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ============================================================
      # 4. SOURCE CHECK
      # ============================================================

      - name: Check Accuracy Source Files
        run: |

          set -e

          echo "=========================================="
          echo "STEP 13-15 SOURCE CHECK"
          echo "=========================================="

          test -f src/13_prediction_archive.py

          test -f src/14_performance_tracker.py

          test -f src/15_accuracy_report.py

          test -f data/analysis/decision.csv

          test -f data/analysis/structure.csv

          test -f data/analysis/market_regime.csv

          test -f data/analysis/top20.csv

          echo "SOURCE FILES : OK"


      # ============================================================
      # 5. PYTHON SYNTAX CHECK
      # ============================================================

      - name: Python Syntax Check
        run: |

          set -e

          echo "=========================================="
          echo "PYTHON SYNTAX CHECK"
          echo "=========================================="

          python -m py_compile \
            src/13_prediction_archive.py

          python -m py_compile \
            src/14_performance_tracker.py

          python -m py_compile \
            src/15_accuracy_report.py

          echo "PYTHON SYNTAX : OK"


      # ============================================================
      # 6. STEP 13
      # ============================================================

      - name: Run STEP 13 Prediction Archive
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 13 - PREDICTION ARCHIVE"
          echo "=========================================="

          python src/13_prediction_archive.py


      # ============================================================
      # 7. STEP 13 VALIDATION
      # ============================================================

      - name: Validate STEP 13
        run: |

          set -e

          echo "=========================================="
          echo "STEP 13 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/prediction_history.csv

          python - <<'PY'

          import pandas as pd

          file = \
              "data/analysis/prediction_history.csv"

          df = pd.read_csv(file)

          print(
              "ROWS   :",
              len(df)
          )

          print(
              "TICKERS:",
              df["ticker"].nunique()
          )

          print(
              "PRICE  :",
              df["signal_price"].notna().sum()
          )

          if df.empty:

              raise RuntimeError(
                  "prediction_history.csv empty"
              )

          if df[
              "signal_price"
          ].isna().any():

              raise RuntimeError(
                  "signal_price contains NaN"
              )

          print(
              "STEP 13 OUTPUT : OK"
          )

          PY


      # ============================================================
      # 8. STEP 14
      # ============================================================

      - name: Run STEP 14 Performance Tracker
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 14 - PERFORMANCE TRACKER"
          echo "=========================================="

          python src/14_performance_tracker.py


      # ============================================================
      # 9. STEP 14 VALIDATION
      # ============================================================

      - name: Validate STEP 14
        run: |

          set -e

          echo "=========================================="
          echo "STEP 14 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/performance_history.csv

          python - <<'PY'

          import pandas as pd

          file = \
              "data/analysis/performance_history.csv"

          df = pd.read_csv(file)

          print(
              "ROWS :",
              len(df)
          )

          for column in [
              "d1_return",
              "d3_return",
              "d5_return",
              "d5_mfe",
              "d5_mae",
          ]:

              if column in df.columns:

                  print(
                      column.upper(),
                      ":",
                      df[column].notna().sum()
                  )

          if df.empty:

              raise RuntimeError(
                  "performance_history.csv empty"
              )

          print(
              "STEP 14 OUTPUT : OK"
          )

          PY


      # ============================================================
      # 10. STEP 15
      # ============================================================

      - name: Run STEP 15 Accuracy Report
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 15 - ACCURACY REPORT"
          echo "=========================================="

          python src/15_accuracy_report.py


      # ============================================================
      # 11. STEP 15 VALIDATION
      # ============================================================

      - name: Validate STEP 15
        run: |

          set -e

          echo "=========================================="
          echo "STEP 15 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/accuracy_report.csv

          python - <<'PY'

          import pandas as pd

          file = \
              "data/analysis/accuracy_report.csv"

          df = pd.read_csv(file)

          print(
              "REPORT ROWS :",
              len(df)
          )

          print()

          print(
              df.to_string(
                  index=False
              )
          )

          if df.empty:

              raise RuntimeError(
                  "accuracy_report.csv empty"
              )

          print()

          print(
              "STEP 15 OUTPUT : OK"
          )

          PY


      # ============================================================
      # 12. COMMIT
      #
      # 검증 데이터만 저장한다.
      #
      # 기존 STEP 1-12 결과에는 손대지 않는다.
      # ============================================================

      - name: Commit Accuracy Data
        run: |

          set -e

          echo "=========================================="
          echo "COMMIT ACCURACY DATA"
          echo "=========================================="

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/analysis/prediction_history.csv \
            data/analysis/performance_history.csv \
            data/analysis/accuracy_report.csv


          if git diff --cached --quiet; then

            echo "NO ACCURACY DATA CHANGES"

          else

            git commit \
              -m "Update option scanner accuracy data [skip ci]"

            echo "ACCURACY DATA COMMITTED"

          fi


      # ============================================================
      # 13. PUSH
      # ============================================================

      - name: Push Accuracy Data
        run: |

          set -e

          echo "=========================================="
          echo "PUSH ACCURACY DATA"
          echo "=========================================="

          git push origin HEAD:main

          echo "PUSH : OK"


      # ============================================================
      # 14. COMPLETE
      # ============================================================

      - name: Accuracy Pipeline Complete
        run: |

          echo "=========================================="
          echo "🔥 STEP 13-15 ACCURACY PIPELINE COMPLETE"
          echo "=========================================="

          echo "STEP 13 : Prediction Archive"
          echo "STEP 14 : Performance Tracker"
          echo "STEP 15 : Accuracy Report"

          echo ""
          echo "prediction_history.csv  : SAVED"
          echo "performance_history.csv : SAVED"
          echo "accuracy_report.csv     : SAVED"

          echo ""
          echo "ACCURACY PIPELINE : SUCCESS"
