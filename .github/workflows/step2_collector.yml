name: STEP 2 - Option Collector

on:
  workflow_dispatch:

jobs:
  collector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Option Collector
        run: |
          python src/02_collector.py

      - name: Upload Raw Option Data
        uses: actions/upload-artifact@v4
        with:
          name: option-raw-data
          path: data/raw/options_raw.csv
