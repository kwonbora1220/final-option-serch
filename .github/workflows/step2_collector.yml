name: STEP 2 - Option Collector

on:
  workflow_dispatch:

jobs:
  collector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Option Collector
        run: |
          python src/02_collector.py

      - name: Check Raw Data
        run: |
          echo "=========================================="
          echo "STEP 2 RAW DATA CHECK"
          echo "=========================================="

          ls -lh data/raw/

          python -c "import pandas as pd; df=pd.read_csv('data/raw/options_raw.csv'); print('ROWS       :', len(df)); print('TICKERS    :', df['symbol'].nunique()); print('DTE MIN    :', df['DTE'].min()); print('DTE MAX    :', df['DTE'].max())"

      - name: Save Raw Data To Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/options_raw.csv

          git diff --cached --quiet || git commit -m "Update raw option data"

          git push

      - name: Upload Raw Option Data
        uses: actions/upload-artifact@v4
        with:
          name: option-raw-data
          path: data/raw/options_raw.csv
