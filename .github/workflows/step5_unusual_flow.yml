name: STEP 5 - Unusual Option Flow

on:
  workflow_dispatch:

concurrency:
  group: option-scanner-step5
  cancel-in-progress: false

jobs:

  unusual-flow:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |

          set -e

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      # ============================================================
      # 4. CHECK NORMALIZED DATA
      #
      # Repository에서 유일하게 직접 사용하는 대용량 입력
      # options_normalized.csv
      #
      # Expected:
      # ~291,997 rows
      # ~548 tickers
      # ============================================================

      - name: Check Normalized Data
        run: |

          set -e

          echo "=========================================="
          echo "STEP 3 INPUT CHECK"
          echo "=========================================="

          test -f data/normalized/options_normalized.csv

          python - <<'PY'
          import pandas as pd

          file = "data/normalized/options_normalized.csv"

          df = pd.read_csv(file)

          rows = len(df)
          tickers = df["symbol"].nunique()

          print("ROWS       :", rows)
          print("COLUMNS    :", len(df.columns))
          print("TICKERS    :", tickers)
          print("DTE MIN    :", df["DTE"].min())
          print("DTE MAX    :", df["DTE"].max())

          if rows < 100000:
              raise RuntimeError(
                  f"Normalized dataset is too small: {rows}"
              )

          if tickers < 500:
              raise RuntimeError(
                  f"Option universe is too small: {tickers}"
              )

          print("NORMALIZED DATA : OK")
          PY

      # ============================================================
      # 5. REMOVE ANY OLD LOCAL GREEKS
      #
      # IMPORTANT:
      # Greeks must ALWAYS be rebuilt from the current normalized
      # dataset.
      #
      # Never trust a repository copy of options_greeks.csv.
      # ============================================================

      - name: Remove Old Local Greeks
        run: |

          set -e

          echo "=========================================="
          echo "REMOVE OLD LOCAL GREEKS"
          echo "=========================================="

          rm -f data/analysis/options_greeks.csv

          if [ -f data/analysis/options_greeks.csv ]; then
            echo "ERROR: Old Greeks file still exists."
            exit 1
          fi

          echo "OLD GREEKS : REMOVED"

      # ============================================================
      # 6. REBUILD CURRENT STEP 4 GREEKS
      # ============================================================

      - name: Rebuild Current Step 4 Greeks
        run: |

          set -e

          echo "=========================================="
          echo "REBUILD CURRENT STEP 4 GREEKS"
          echo "=========================================="

          python src/04_greeks.py

      # ============================================================
      # 7. VERIFY CURRENT GREEKS
      #
      # Expected:
      # ~291,997 rows
      # ~548 tickers
      # ============================================================

      - name: Verify Current Greeks
        run: |

          set -e

          echo "=========================================="
          echo "CURRENT GREEKS CHECK"
          echo "=========================================="

          test -f data/analysis/options_greeks.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/options_greeks.csv"

          df = pd.read_csv(file)

          rows = len(df)
          tickers = df["symbol"].nunique()

          print("ROWS       :", rows)
          print("COLUMNS    :", len(df.columns))
          print("TICKERS    :", tickers)
          print("DTE MIN    :", df["DTE"].min())
          print("DTE MAX    :", df["DTE"].max())

          print(
              "VALID DELTA:",
              df["delta"].notna().sum()
          )

          print(
              "VALID GAMMA:",
              df["gamma"].notna().sum()
          )

          print(
              "VALID VEGA :",
              df["vega"].notna().sum()
          )

          if rows < 100000:
              raise RuntimeError(
                  f"Greeks dataset is too small: {rows}"
              )

          if tickers < 500:
              raise RuntimeError(
                  f"Greeks ticker count is too small: {tickers}"
              )

          print("CURRENT GREEKS : OK")
          PY

      # ============================================================
      # 8. REMOVE OLD UNUSUAL FLOW
      #
      # IMPORTANT:
      # Never allow an old 10-ticker unusual_flow.csv to survive
      # inside the runner.
      # ============================================================

      - name: Remove Old Unusual Flow
        run: |

          set -e

          echo "=========================================="
          echo "REMOVE OLD UNUSUAL FLOW"
          echo "=========================================="

          rm -f data/analysis/unusual_flow.csv

          if [ -f data/analysis/unusual_flow.csv ]; then
            echo "ERROR: Old unusual_flow.csv still exists."
            exit 1
          fi

          echo "OLD UNUSUAL FLOW : REMOVED"

      # ============================================================
      # 9. RUN STEP 5
      # ============================================================

      - name: Run Step 5 Unusual Flow
        run: |

          set -e

          echo "=========================================="
          echo "RUN STEP 5 UNUSUAL FLOW"
          echo "=========================================="

          python src/05_unusual_flow.py

      # ============================================================
      # 10. VERIFY STEP 5 OUTPUT
      #
      # This is the critical validation.
      #
      # Expected:
      # ~291,997 rows
      # ~548 tickers
      # ============================================================

      - name: Check Step 5 Output
        run: |

          set -e

          echo "=========================================="
          echo "STEP 5 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/unusual_flow.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/unusual_flow.csv"

          df = pd.read_csv(file)

          rows = len(df)
          tickers = df["symbol"].nunique()

          print("ROWS        :", rows)
          print("COLUMNS     :", len(df.columns))
          print("TICKERS     :", tickers)

          print(
              "FLOW SCORE  :",
              df["flow_score"].notna().sum()
          )

          print(
              "BUY EST.    :",
              (df["trade_side_estimate"] == "BUY EST.").sum()
          )

          print(
              "SELL EST.   :",
              (df["trade_side_estimate"] == "SELL EST.").sum()
          )

          print(
              "UNKNOWN     :",
              (df["trade_side_estimate"] == "UNKNOWN").sum()
          )

          if rows < 100000:
              raise RuntimeError(
                  f"Unusual flow row count too small: {rows}"
              )

          if tickers < 500:
              raise RuntimeError(
                  f"Unusual flow ticker count too small: {tickers}"
              )

          print("STEP 5 OUTPUT : OK")
          PY

      # ============================================================
      # 11. FINAL DATA FLOW VALIDATION
      #
      # Explicitly verify:
      #
      # Normalized
      #      ↓
      # Greeks
      #      ↓
      # Unusual Flow
      #
      # all contain the same universe.
      # ============================================================

      - name: Validate Step 3 4 5 Universe
        run: |

          set -e

          echo "=========================================="
          echo "STEP 3 -> STEP 4 -> STEP 5 UNIVERSE CHECK"
          echo "=========================================="

          python - <<'PY'
          import pandas as pd

          normalized_file = (
              "data/normalized/options_normalized.csv"
          )

          greeks_file = (
              "data/analysis/options_greeks.csv"
          )

          flow_file = (
              "data/analysis/unusual_flow.csv"
          )

          normalized = pd.read_csv(
              normalized_file,
              usecols=["symbol"]
          )

          greeks = pd.read_csv(
              greeks_file,
              usecols=["symbol"]
          )

          flow = pd.read_csv(
              flow_file,
              usecols=["symbol"]
          )

          n_symbols = set(
              normalized["symbol"]
              .dropna()
              .astype(str)
              .unique()
          )

          g_symbols = set(
              greeks["symbol"]
              .dropna()
              .astype(str)
              .unique()
          )

          f_symbols = set(
              flow["symbol"]
              .dropna()
              .astype(str)
              .unique()
          )

          print(
              "NORMALIZED TICKERS :",
              len(n_symbols)
          )

          print(
              "GREEKS TICKERS     :",
              len(g_symbols)
          )

          print(
              "FLOW TICKERS       :",
              len(f_symbols)
          )

          missing_greeks = (
              n_symbols - g_symbols
          )

          missing_flow = (
              n_symbols - f_symbols
          )

          print(
              "MISSING IN GREEKS  :",
              len(missing_greeks)
          )

          print(
              "MISSING IN FLOW    :",
              len(missing_flow)
          )

          if len(g_symbols) < 500:
              raise RuntimeError(
                  "Greeks universe unexpectedly small."
              )

          if len(f_symbols) < 500:
              raise RuntimeError(
                  "Flow universe unexpectedly small."
              )

          print("UNIVERSE FLOW : OK")
          PY

      # ============================================================
      # 12. UPLOAD STEP 5 ARTIFACT
      #
      # DO NOT COMMIT TO GITHUB.
      #
      # unusual_flow.csv is ~178MB and exceeds GitHub's
      # normal repository file limit.
      #
      # Artifact storage is used instead.
      # ============================================================

      - name: Upload Step 5 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: step5-unusual-flow-output
          path: data/analysis/unusual_flow.csv
          retention-days: 1

      # ============================================================
      # 13. FINAL
      # ============================================================

      - name: Step 5 Complete
        run: |

          echo "=========================================="
          echo "STEP 5 COMPLETE"
          echo "=========================================="

          echo "STEP 3 NORMALIZED : CURRENT"
          echo "STEP 4 GREEKS     : REBUILT"
          echo "STEP 5 FLOW       : CURRENT"

          echo "options_greeks.csv : LOCAL ONLY"
          echo "unusual_flow.csv   : ARTIFACT ONLY"
          echo "Git commit         : NOT USED"
          echo "Git push           : NOT USED"

          echo "STEP 5 STATUS : PASS"
