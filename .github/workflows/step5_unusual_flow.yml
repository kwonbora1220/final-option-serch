
name: STEP 5 - Unusual Option Flow

on:
  workflow_dispatch:

concurrency:
  group: option-scanner-step5
  cancel-in-progress: false

jobs:
  unusual-flow:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. CHECK CURRENT NORMALIZED DATA
      #
      # IMPORTANT:
      # Never use the old 27,961-row options_greeks.csv
      # stored in the repository.
      # ============================================================

      - name: Check Normalized Data
        run: |

          echo "=========================================="
          echo "STEP 3 INPUT CHECK"
          echo "=========================================="

          test -f data/normalized/options_normalized.csv

          python - <<'PY'
          import pandas as pd

          file = "data/normalized/options_normalized.csv"

          df = pd.read_csv(file)

          print("ROWS       :", len(df))
          print("COLUMNS    :", len(df.columns))
          print("TICKERS    :", df["symbol"].nunique())
          print("DTE MIN    :", df["DTE"].min())
          print("DTE MAX    :", df["DTE"].max())

          if len(df) < 100000:
              raise RuntimeError(
                  f"Normalized dataset is too small: {len(df)}"
              )

          if df["symbol"].nunique() < 500:
              raise RuntimeError(
                  f"Option universe is too small: "
                  f"{df['symbol'].nunique()}"
              )

          print("NORMALIZED DATA : OK")
          PY

      # ============================================================
      # 5. REBUILD GREEKS FROM CURRENT NORMALIZED DATA
      #
      # IMPORTANT:
      # This intentionally does NOT read
      # data/analysis/options_greeks.csv
      #
      # It guarantees STEP 5 uses the current 548-ticker universe.
      # ============================================================

      - name: Rebuild Current Greeks
        run: |

          echo "=========================================="
          echo "REBUILD CURRENT STEP 4 GREEKS"
          echo "=========================================="

          rm -f data/analysis/options_greeks.csv

          python src/04_greeks.py

      # ============================================================
      # 6. VERIFY CURRENT GREEKS
      # ============================================================

      - name: Verify Current Greeks
        run: |

          echo "=========================================="
          echo "CURRENT GREEKS CHECK"
          echo "=========================================="

          test -f data/analysis/options_greeks.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/options_greeks.csv"

          df = pd.read_csv(file)

          print("ROWS       :", len(df))
          print("COLUMNS    :", len(df.columns))
          print("TICKERS    :", df["symbol"].nunique())
          print("DTE MIN    :", df["DTE"].min())
          print("DTE MAX    :", df["DTE"].max())
          print("VALID DELTA:", df["delta"].notna().sum())
          print("VALID GAMMA:", df["gamma"].notna().sum())
          print("VALID VEGA :", df["vega"].notna().sum())

          if len(df) < 100000:
              raise RuntimeError(
                  f"Greeks dataset is too small: {len(df)}"
              )

          if df["symbol"].nunique() < 500:
              raise RuntimeError(
                  f"Greeks ticker count is too small: "
                  f"{df['symbol'].nunique()}"
              )

          print("CURRENT GREEKS : OK")
          PY

      # ============================================================
      # 7. RUN STEP 5
      # ============================================================

      - name: Run Unusual Flow Engine
        run: |

          echo "=========================================="
          echo "RUN STEP 5 UNUSUAL FLOW"
          echo "=========================================="

          python src/05_unusual_flow.py

      # ============================================================
      # 8. VALIDATE STEP 5
      # ============================================================

      - name: Check Unusual Flow Output
        run: |

          echo "=========================================="
          echo "STEP 5 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/unusual_flow.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/unusual_flow.csv"

          df = pd.read_csv(file)

          print("ROWS        :", len(df))
          print("COLUMNS     :", len(df.columns))
          print("TICKERS     :", df["symbol"].nunique())
          print("FLOW SCORE  :", df["flow_score"].notna().sum())
          print(
              "BUY EST.    :",
              (df["trade_side_estimate"] == "BUY EST.").sum()
          )
          print(
              "SELL EST.   :",
              (df["trade_side_estimate"] == "SELL EST.").sum()
          )

          if len(df) < 100000:
              raise RuntimeError(
                  f"Unusual flow row count too small: {len(df)}"
              )

          if df["symbol"].nunique() < 500:
              raise RuntimeError(
                  f"Unusual flow ticker count too small: "
                  f"{df['symbol'].nunique()}"
              )

          print("STEP 5 OUTPUT : OK")
          PY

      # ============================================================
      # 9. SAVE STEP 5 OUTPUT
      #
      # unusual_flow.csv is much smaller than Greeks,
      # so it may be committed safely.
      # ============================================================

      - name: Save Unusual Flow Data
        run: |

          set -e

          echo "=========================================="
          echo "PREPARE STEP 5 COMMIT"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/analysis/unusual_flow.csv

          if git diff --cached --quiet; then
            echo "NO CHANGES TO COMMIT"
            exit 0
          fi

          git commit -m "Update unusual option flow analysis"

          echo "STEP 5 COMMIT CREATED"

      # ============================================================
      # 10. PUSH
      # ============================================================

      - name: Push Step 5 Data
        run: |

          set -e

          echo "=========================================="
          echo "SYNC WITH REMOTE MAIN"
          echo "=========================================="

          git fetch origin main

          git rebase origin/main

          echo "=========================================="
          echo "PUSH STEP 5 DATA"
          echo "=========================================="

          git push origin HEAD:main

      # ============================================================
      # 11. ARTIFACT - ARCHIVE ONLY
      # ============================================================

      - name: Upload Unusual Flow Data
        uses: actions/upload-artifact@v4
        with:
          name: step5-unusual-flow-output
          path: data/analysis/unusual_flow.csv
          retention-days: 1

      # ============================================================
      # 12. FINAL
      # ============================================================

      - name: STEP 5 Complete
        run: |

          echo "=========================================="
          echo "STEP 5 COMPLETE"
          echo "=========================================="

          echo "Current option universe processed."
          echo "Expected ticker count : 548"
          echo "Expected rows         : ~291,997"
          echo "Old 27,961-row Greeks file was NOT used."
