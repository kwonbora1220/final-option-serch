name: STEP 5 - Unusual Option Flow

on:
  workflow_dispatch:

concurrency:
  group: option-scanner-main-writer
  cancel-in-progress: false

jobs:
  unusual-flow:
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================================
      # PYTHON
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========================================================
      # STEP 4 INPUT CHECK
      # ========================================================

      - name: Check Greeks Data
        run: |
          echo "=========================================="
          echo "STEP 4 INPUT CHECK"
          echo "=========================================="

          if [ ! -f data/analysis/options_greeks.csv ]; then
            echo "ERROR: options_greeks.csv not found"
            exit 1
          fi

          ls -lh data/analysis/options_greeks.csv

          python -c "import pandas as pd; df=pd.read_csv('data/analysis/options_greeks.csv'); print('ROWS       :', len(df)); print('COLUMNS    :', len(df.columns)); print('TICKERS    :', df['symbol'].nunique()); print('DTE MIN    :', df['DTE'].min()); print('DTE MAX    :', df['DTE'].max()); print('VALID DELTA:', df['delta'].notna().sum()); print('VALID GAMMA:', df['gamma'].notna().sum()); print('VALID VEGA :', df['vega'].notna().sum())"

      # ========================================================
      # STEP 5
      # ========================================================

      - name: Run Unusual Flow Engine
        run: |
          echo "=========================================="
          echo "RUN STEP 5 UNUSUAL FLOW"
          echo "=========================================="

          python src/05_unusual_flow.py

      # ========================================================
      # STEP 5 OUTPUT CHECK
      # ========================================================

      - name: Check Unusual Flow Output
        run: |
          echo "=========================================="
          echo "STEP 5 OUTPUT CHECK"
          echo "=========================================="

          if [ ! -f data/analysis/unusual_flow.csv ]; then
            echo "ERROR: unusual_flow.csv was not created"
            exit 1
          fi

          ls -lh data/analysis/unusual_flow.csv

          python -c "import pandas as pd; df=pd.read_csv('data/analysis/unusual_flow.csv'); print('ROWS       :', len(df)); print('COLUMNS    :', len(df.columns)); print('TICKERS    :', df['symbol'].nunique()); print('FLOW SCORE :', df['flow_score'].notna().sum()); print('BUY EST.   :', (df['trade_side_estimate']=='BUY EST.').sum()); print('SELL EST.  :', (df['trade_side_estimate']=='SELL EST.').sum())"

      # ========================================================
      # SAVE STEP 5 ONLY
      #
      # IMPORTANT:
      # options_greeks.csv is intentionally NOT committed.
      # It is too large for GitHub's 100 MB file limit.
      #
      # Only unusual_flow.csv is committed.
      # ========================================================

      - name: Save Unusual Flow Data To Repository
        run: |
          set -e

          echo "=========================================="
          echo "PREPARE STEP 5 COMMIT"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ----------------------------------------------------
          # IMPORTANT
          #
          # STEP 4 creates options_greeks.csv locally.
          # It must never be committed to GitHub.
          #
          # Remove it from the working tree before committing
          # STEP 5 output.
          # ----------------------------------------------------

          rm -f data/analysis/options_greeks.csv

          # ----------------------------------------------------
          # Stage ONLY STEP 5 output
          # ----------------------------------------------------

          git add data/analysis/unusual_flow.csv

          echo "=========================================="
          echo "CHECK STAGED FILES"
          echo "=========================================="

          git diff --cached --name-only

          # ----------------------------------------------------
          # Nothing changed
          # ----------------------------------------------------

          if git diff --cached --quiet; then
            echo "NO CHANGES TO COMMIT"
            exit 0
          fi

          # ----------------------------------------------------
          # Commit
          # ----------------------------------------------------

          git commit -m "Add unusual option flow analysis"

          echo "=========================================="
          echo "PUSH STEP 5 DATA"
          echo "=========================================="

          git push origin HEAD:main

          echo "=========================================="
          echo "STEP 5 GIT SAVE COMPLETE"
          echo "=========================================="

      # ========================================================
      # ARTIFACT
      # ========================================================

      - name: Upload Unusual Flow Data
        uses: actions/upload-artifact@v4
        with:
          name: unusual-flow-data
          path: data/analysis/unusual_flow.csv

      # ========================================================
      # FINAL
      # ========================================================

      - name: STEP 5 Final Check
        run: |
          echo "=========================================="
          echo "STEP 5 COMPLETE"
          echo "=========================================="
          echo "Unusual Option Flow analysis completed successfully."
          echo "Output : data/analysis/unusual_flow.csv"
          echo "=========================================="
