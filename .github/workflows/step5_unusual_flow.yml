  - name: Push Step 5 Data
    run: |

      set -e

      echo "=========================================="
      echo "SYNC WITH REMOTE MAIN"
      echo "=========================================="

      echo "GIT STATUS BEFORE SYNC"
      git status --short

      # STEP 4 local-only generated file
      rm -f data/analysis/options_greeks.csv

      echo "GIT STATUS AFTER CLEANUP"
      git status --short

      git fetch origin main

      git rebase origin/main

      echo "=========================================="
      echo "PUSH STEP 5 DATA"
      echo "=========================================="

      git push origin HEAD:main
