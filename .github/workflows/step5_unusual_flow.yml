name: STEP 5 - Unusual Option Flow

on:
  workflow_dispatch:

concurrency:
  group: option-scanner-step5
  cancel-in-progress: false

jobs:
  unusual-flow:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. CHECK CURRENT NORMALIZED DATA
      #
      # SOURCE:
      # data/normalized/options_normalized.csv
      #
      # This is the ONLY persistent input for STEP 4.
      # ============================================================

      - name: Check Normalized Data
        run: |

          set -e

          echo "=========================================="
          echo "STEP 3 INPUT CHECK"
          echo "=========================================="

          FILE="data/normalized/options_normalized.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Normalized file not found"
            exit 1
          fi

          python - <<'PY'
          import pandas as pd

          file = "data/normalized/options_normalized.csv"

          df = pd.read_csv(file)

          rows = len(df)
          tickers = df["symbol"].nunique()

          print("ROWS       :", rows)
          print("COLUMNS    :", len(df.columns))
          print("TICKERS    :", tickers)
          print("DTE MIN    :", df["DTE"].min())
          print("DTE MAX    :", df["DTE"].max())

          if rows < 100000:
              raise RuntimeError(
                  f"Normalized dataset is too small: {rows}"
              )

          if tickers < 500:
              raise RuntimeError(
                  f"Option universe is too small: {tickers}"
              )

          print("NORMALIZED DATA : OK")
          PY

      # ============================================================
      # 5. REMOVE ANY OLD LOCAL-ONLY GREEKS
      #
      # IMPORTANT:
      # options_greeks.csv is NOT a repository input.
      # It is generated fresh in this Runner.
      # ============================================================

      - name: Remove Old Local Greeks
        run: |

          set -e

          echo "=========================================="
          echo "REMOVE OLD LOCAL GREEKS"
          echo "=========================================="

          rm -f data/analysis/options_greeks.csv

          if [ -f data/analysis/options_greeks.csv ]; then
            echo "ERROR: Old Greeks file still exists"
            exit 1
          fi

          echo "OLD LOCAL GREEKS : REMOVED"

      # ============================================================
      # 6. REBUILD CURRENT STEP 4 GREEKS
      #
      # IMPORTANT:
      #
      # 04_greeks.py MUST read:
      #
      # data/normalized/options_normalized.csv
      #
      # and create:
      #
      # data/analysis/options_greeks.csv
      #
      # locally inside this Runner.
      # ============================================================

      - name: Rebuild Current STEP 4 Greeks
        run: |

          set -e

          echo "=========================================="
          echo "REBUILD CURRENT STEP 4 GREEKS"
          echo "=========================================="

          python src/04_greeks.py

      # ============================================================
      # 7. VERIFY CURRENT GREEKS
      #
      # This confirms STEP 5 is NOT using the old 10-ticker file.
      # ============================================================

      - name: Verify Current Greeks
        run: |

          set -e

          echo "=========================================="
          echo "CURRENT GREEKS CHECK"
          echo "=========================================="

          FILE="data/analysis/options_greeks.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Current Greeks file was not generated"
            exit 1
          fi

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/options_greeks.csv"

          df = pd.read_csv(file)

          rows = len(df)
          tickers = df["symbol"].nunique()

          print("ROWS       :", rows)
          print("COLUMNS    :", len(df.columns))
          print("TICKERS    :", tickers)
          print("DTE MIN    :", df["DTE"].min())
          print("DTE MAX    :", df["DTE"].max())

          print(
              "VALID DELTA:",
              df["delta"].notna().sum()
          )

          print(
              "VALID GAMMA:",
              df["gamma"].notna().sum()
          )

          print(
              "VALID VEGA :",
              df["vega"].notna().sum()
          )

          if rows < 100000:
              raise RuntimeError(
                  f"Greeks dataset is too small: {rows}"
              )

          if tickers < 500:
              raise RuntimeError(
                  f"Greeks ticker count is too small: {tickers}"
              )

          print("CURRENT GREEKS : OK")
          PY

      # ============================================================
      # 8. RUN STEP 5
      #
      # 05_unusual_flow.py reads ONLY the freshly generated
      # data/analysis/options_greeks.csv
      # ============================================================

      - name: Run STEP 5 Unusual Flow
        run: |

          set -e

          echo "=========================================="
          echo "RUN STEP 5 UNUSUAL FLOW"
          echo "=========================================="

          python src/05_unusual_flow.py

      # ============================================================
      # 9. VERIFY STEP 5 OUTPUT
      # ============================================================

      - name: Check STEP 5 Output
        run: |

          set -e

          echo "=========================================="
          echo "STEP 5 OUTPUT CHECK"
          echo "=========================================="

          FILE="data/analysis/unusual_flow.csv"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: unusual_flow.csv was not generated"
            exit 1
          fi

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/unusual_flow.csv"

          df = pd.read_csv(file)

          rows = len(df)
          tickers = df["symbol"].nunique()

          print("ROWS        :", rows)
          print("COLUMNS     :", len(df.columns))
          print("TICKERS     :", tickers)
          print(
              "FLOW SCORE  :",
              df["flow_score"].notna().sum()
          )

          print(
              "BUY EST.    :",
              (df["trade_side_estimate"] == "BUY EST.").sum()
          )

          print(
              "SELL EST.   :",
              (df["trade_side_estimate"] == "SELL EST.").sum()
          )

          print(
              "UNKNOWN EST.:",
              (df["trade_side_estimate"] == "UNKNOWN").sum()
          )

          print(
              "DTE MIN     :",
              df["DTE"].min()
          )

          print(
              "DTE MAX     :",
              df["DTE"].max()
          )

          if rows < 100000:
              raise RuntimeError(
                  f"Unusual flow row count too small: {rows}"
              )

          if tickers < 500:
              raise RuntimeError(
                  f"Unusual flow ticker count too small: {tickers}"
              )

          print("STEP 5 OUTPUT : OK")
          PY

      # ============================================================
      # 10. VERIFY NO GIT MODIFICATION
      #
      # Generated Greeks / Flow files must NEVER be committed.
      # ============================================================

      - name: Verify Generated Files Are Local Only
        run: |

          set -e

          echo "=========================================="
          echo "GIT STATUS CHECK"
          echo "=========================================="

          git status --short

          echo ""
          echo "Generated analysis files:"
          ls -lh data/analysis/options_greeks.csv
          ls -lh data/analysis/unusual_flow.csv

          echo ""
          echo "IMPORTANT:"
          echo "These files remain LOCAL to this GitHub Actions Runner."
          echo "They are NOT committed."
          echo "They are NOT pushed to GitHub."

      # ============================================================
      # 11. UPLOAD ARTIFACT
      #
      # Artifact is NOT a Git commit.
      # This is only for inspection/download from Actions.
      # ============================================================

      - name: Upload STEP 5 Output
        uses: actions/upload-artifact@v4
        with:
          name: step5-unusual-flow-output
          path: |
            data/analysis/unusual_flow.csv
          retention-days: 1

      # ============================================================
      # 12. FINAL
      # ============================================================

      - name: STEP 5 Complete
        run: |

          echo "=========================================="
          echo "STEP 5 COMPLETE"
          echo "=========================================="

          echo "STEP 4 source : data/normalized/options_normalized.csv"
          echo "STEP 4 output : data/analysis/options_greeks.csv"
          echo "STEP 5 output : data/analysis/unusual_flow.csv"
          echo ""
          echo "Generated CSV files were NOT committed to GitHub."
          echo "Generated CSV files were NOT pushed to GitHub."
          echo ""
          echo "STEP 5 VERIFIED."
