name: Option Flow Scanner V3

on:
  workflow_dispatch:

jobs:
  market-regime:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # STEP 1
      # ============================================================

      - name: Run Market Regime
        run: |
          echo "=========================================="
          echo "STEP 1 MARKET REGIME"
          echo "=========================================="

          python main.py

      # ============================================================
      # STEP 1 OUTPUT CHECK
      # ============================================================

      - name: STEP 1 Output Check
        run: |
          echo "=========================================="
          echo "STEP 1 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/market_regime.csv

          echo ""
          echo "MARKET REGIME FILE"
          echo "------------------------------------------"

          ls -lh data/analysis/market_regime.csv

          echo ""
          cat data/analysis/market_regime.csv

          echo ""
          echo "STEP 1 OUTPUT : OK"

      # ============================================================
      # SAVE STEP 1
      # ============================================================

      - name: Save STEP 1 result to GitHub
        run: |
          echo "=========================================="
          echo "SAVE STEP 1 RESULT"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/analysis/market_regime.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add STEP 1 market regime"
            git push
          fi

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: STEP 1 Complete
        run: |
          echo "=========================================="
          echo "🔥 STEP 1 MARKET REGIME COMPLETE"
          echo "=========================================="

          echo "market_regime.csv saved to:"
          echo "data/analysis/market_regime.csv"
