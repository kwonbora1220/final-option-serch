name: STEP 13-16 - Accuracy & Confidence Validation

on:

  workflow_dispatch:

  # 미국장 종료 후 KST 08:00
  # UTC 23:00 = KST 08:00
  schedule:
    - cron: "0 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: option-scanner-accuracy
  cancel-in-progress: false


jobs:

  accuracy-validation:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          persist-credentials: true


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |

          set -e

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ============================================================
      # 4. SOURCE CHECK
      # ============================================================

      - name: Check Accuracy Source Files
        run: |

          set -e

          echo "=========================================="
          echo "STEP 13-16 SOURCE CHECK"
          echo "=========================================="

          test -f src/13_prediction_archive.py

          test -f src/14_performance_tracker.py

          test -f src/15_accuracy_report.py

          test -f src/16_confidence_report.py

          test -f data/analysis/decision.csv

          test -f data/analysis/structure.csv

          test -f data/analysis/market_regime.csv

          test -f data/analysis/top20.csv

          echo ""
          echo "ALL SOURCE FILES : OK"


      # ============================================================
      # 5. PYTHON SYNTAX CHECK
      # ============================================================

      - name: Python Syntax Check
        run: |

          set -e

          echo "=========================================="
          echo "PYTHON SYNTAX CHECK"
          echo "=========================================="

          python -m py_compile \
            src/13_prediction_archive.py

          python -m py_compile \
            src/14_performance_tracker.py

          python -m py_compile \
            src/15_accuracy_report.py

          python -m py_compile \
            src/16_confidence_report.py

          echo ""
          echo "PYTHON SYNTAX : OK"


      # ============================================================
      # 6. STEP 13
      # ============================================================

      - name: Run STEP 13 Prediction Archive
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 13 - PREDICTION ARCHIVE"
          echo "=========================================="

          python src/13_prediction_archive.py


      # ============================================================
      # 7. STEP 13 VALIDATION
      # ============================================================

      - name: Validate STEP 13
        run: |

          set -e

          echo "=========================================="
          echo "STEP 13 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/prediction_history.csv

          python - <<'PY'

          import pandas as pd

          file = \
              "data/analysis/prediction_history.csv"

          df = pd.read_csv(file)

          print(
              "ROWS   :",
              len(df)
          )

          print(
              "TICKERS:",
              df["ticker"].nunique()
          )

          print(
              "PRICE  :",
              df["signal_price"].notna().sum()
          )

          if df.empty:

              raise RuntimeError(
                  "prediction_history.csv empty"
              )

          if df[
              "signal_price"
          ].isna().any():

              raise RuntimeError(
                  "signal_price contains NaN"
              )

          print(
              "STEP 13 OUTPUT : OK"
          )

          PY


      # ============================================================
      # 8. STEP 14
      # ============================================================

      - name: Run STEP 14 Performance Tracker
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 14 - PERFORMANCE TRACKER"
          echo "=========================================="

          python src/14_performance_tracker.py


      # ============================================================
      # 9. STEP 14 VALIDATION
      # ============================================================

      - name: Validate STEP 14
        run: |

          set -e

          echo "=========================================="
          echo "STEP 14 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/performance_history.csv

          python - <<'PY'

          import pandas as pd

          file = \
              "data/analysis/performance_history.csv"

          df = pd.read_csv(file)

          print(
              "ROWS :",
              len(df)
          )

          for column in [
              "d1_return",
              "d3_return",
              "d5_return",
              "d5_mfe",
              "d5_mae",
          ]:

              if column in df.columns:

                  print(
                      column.upper(),
                      ":",
                      df[column].notna().sum()
                  )

          if df.empty:

              raise RuntimeError(
                  "performance_history.csv empty"
              )

          print(
              "STEP 14 OUTPUT : OK"
          )

          PY


      # ============================================================
      # 10. STEP 15
      # ============================================================

      - name: Run STEP 15 Accuracy Report
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 15 - ACCURACY REPORT"
          echo "=========================================="

          python src/15_accuracy_report.py


      # ============================================================
      # 11. STEP 15 VALIDATION
      # ============================================================

      - name: Validate STEP 15
        run: |

          set -e

          echo "=========================================="
          echo "STEP 15 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/accuracy_report.csv

          python - <<'PY'

          import pandas as pd

          file = \
              "data/analysis/accuracy_report.csv"

          df = pd.read_csv(file)

          print(
              "REPORT ROWS :",
              len(df)
          )

          print()

          print(
              df.to_string(
                  index=False
              )
          )

          if df.empty:

              raise RuntimeError(
                  "accuracy_report.csv empty"
              )

          print()

          print(
              "STEP 15 OUTPUT : OK"
          )

          PY


      # ============================================================
      # 12. STEP 16
      #
      # CONFIDENCE REPORT
      #
      # STEP 15까지 쌓인 실제 결과를 이용하여
      # 현재 옵션분석기의 신뢰도를 계산한다.
      # ============================================================

      - name: Run STEP 16 Confidence Report
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 16 - CONFIDENCE REPORT"
          echo "=========================================="

          test -f \
            data/analysis/prediction_history.csv

          test -f \
            data/analysis/performance_history.csv

          test -f \
            data/analysis/accuracy_report.csv

          python src/16_confidence_report.py


      # ============================================================
      # 13. STEP 16 VALIDATION
      # ============================================================

      - name: Validate STEP 16
        run: |

          set -e

          echo "=========================================="
          echo "STEP 16 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/confidence_report.csv

          python - <<'PY'

          import pandas as pd

          file = \
              "data/analysis/confidence_report.csv"

          df = pd.read_csv(file)

          print()
          print(
              "=========================================="
          )
          print(
              "🔥 CONFIDENCE REPORT"
          )
          print(
              "=========================================="
          )

          print()

          print(
              "ROWS :",
              len(df)
          )

          print()

          print(
              df.to_string(
                  index=False
              )
          )

          if df.empty:

              raise RuntimeError(
                  "confidence_report.csv empty"
              )

          # --------------------------------------------------------
          # 가능한 신뢰도 컬럼 확인
          # --------------------------------------------------------

          confidence_columns = [
              "confidence",
              "confidence_score",
              "overall_confidence",
              "accuracy",
          ]

          found = [
              c
              for c in confidence_columns
              if c in df.columns
          ]

          print()

          if found:

              print(
                  "CONFIDENCE COLUMNS :",
                  ", ".join(found)
              )

              for column in found:

                  numeric = pd.to_numeric(
                      df[column],
                      errors="coerce"
                  )

                  valid = numeric.notna()

                  if valid.any():

                      print(
                          f"{column.upper()} "
                          f"MIN :",
                          numeric[valid].min()
                      )

                      print(
                          f"{column.upper()} "
                          f"MAX :",
                          numeric[valid].max()
                      )

                      print(
                          f"{column.upper()} "
                          f"AVG :",
                          numeric[valid].mean()
                      )

          else:

              print(
                  "WARNING:"
              )

              print(
                  "No standard confidence "
                  "column detected."
              )

          print()

          print(
              "STEP 16 OUTPUT : OK"
          )

          PY


      # ============================================================
      # 14. DISPLAY ACCURACY / CONFIDENCE SUMMARY
      #
      # GitHub Actions 로그에서
      # 실제 신뢰성 축적 상태를 바로 확인할 수 있게 한다.
      # ============================================================

      - name: Display Confidence Summary
        run: |

          set -e

          python - <<'PY'

          import pandas as pd
          from pathlib import Path

          print()
          print("==========================================")
          print("🔥 OPTION SCANNER RELIABILITY SUMMARY")
          print("==========================================")

          files = {
              "Prediction History":
                  "data/analysis/prediction_history.csv",

              "Performance History":
                  "data/analysis/performance_history.csv",

              "Accuracy Report":
                  "data/analysis/accuracy_report.csv",

              "Confidence Report":
                  "data/analysis/confidence_report.csv",
          }

          for name, path in files.items():

              p = Path(path)

              if not p.exists():

                  print(
                      f"{name:<22}: MISSING"
                  )

                  continue

              try:

                  df = pd.read_csv(path)

                  print(
                      f"{name:<22}: "
                      f"{len(df)} rows"
                  )

              except Exception as e:

                  print(
                      f"{name:<22}: "
                      f"READ ERROR - {e}"
                  )

          print()
          print("==========================================")
          print("📊 CONFIDENCE REPORT")
          print("==========================================")

          confidence = pd.read_csv(
              "data/analysis/confidence_report.csv"
          )

          print()

          print(
              confidence.to_string(
                  index=False
              )
          )

          print()
          print("==========================================")
          print("🔥 RELIABILITY DATA IS ACCUMULATING")
          print("==========================================")

          PY


      # ============================================================
      # 15. COMMIT ACCURACY / CONFIDENCE DATA
      # ============================================================

      - name: Commit Accuracy and Confidence Data
        run: |

          set -e

          echo "=========================================="
          echo "COMMIT ACCURACY / CONFIDENCE DATA"
          echo "=========================================="

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/analysis/prediction_history.csv \
            data/analysis/performance_history.csv \
            data/analysis/accuracy_report.csv \
            data/analysis/confidence_report.csv


          if git diff --cached --quiet; then

            echo "NO ACCURACY / CONFIDENCE CHANGES"

          else

            git commit \
              -m "Update option scanner accuracy and confidence [skip ci]"

            echo "ACCURACY / CONFIDENCE DATA COMMITTED"

          fi


      # ============================================================
      # 16. SYNC MAIN
      #
      # 다른 workflow가 main에 결과를 기록했을 경우
      # push 충돌을 줄이기 위한 단계
      # ============================================================

      - name: Sync with Remote Main
        run: |

          set -e

          echo "=========================================="
          echo "SYNC WITH REMOTE MAIN"
          echo "=========================================="

          git fetch origin main

          if git diff --quiet HEAD origin/main; then

            echo "LOCAL MAIN IS UP TO DATE"

          else

            echo "REMOTE MAIN HAS NEW COMMITS"

            git rebase origin/main

          fi

          echo "SYNC : OK"


      # ============================================================
      # 17. PUSH
      # ============================================================

      - name: Push Accuracy Data
        run: |

          set -e

          echo "=========================================="
          echo "PUSH ACCURACY / CONFIDENCE DATA"
          echo "=========================================="

          git push origin HEAD:main

          echo "PUSH : OK"


      # ============================================================
      # 18. COMPLETE
      # ============================================================

      - name: Accuracy Pipeline Complete
        run: |

          echo ""
          echo "=========================================="
          echo "🔥🔥 STEP 13-16 COMPLETE"
          echo "=========================================="

          echo ""
          echo "STEP 13 : Prediction Archive"
          echo "STEP 14 : Performance Tracker"
          echo "STEP 15 : Accuracy Report"
          echo "STEP 16 : Confidence Report"

          echo ""
          echo "prediction_history.csv  : SAVED"
          echo "performance_history.csv : SAVED"
          echo "accuracy_report.csv     : SAVED"
          echo "confidence_report.csv   : SAVED"

          echo ""
          echo "=========================================="
          echo "RELIABILITY DATA : ACCUMULATING"
          echo "=========================================="
