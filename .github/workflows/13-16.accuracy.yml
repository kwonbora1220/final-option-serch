
name: STEP 13-16 - Accuracy & Reliability Validation

on:

  workflow_dispatch:

  # 미국장 종료 후 KST 08:00
  # UTC 23:00 = KST 08:00
  schedule:
    - cron: "0 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: option-scanner-accuracy
  cancel-in-progress: false


jobs:

  accuracy-validation:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          persist-credentials: true


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |

          set -e

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ============================================================
      # 4. SOURCE CHECK
      #
      # IMPORTANT
      #
      # STEP 16은 이제
      #
      # 16_confidence_report.py ❌ 사용하지 않음
      #
      # 16_reliability_report.py ✅ 사용
      # ============================================================

      - name: Check Accuracy Source Files
        run: |

          set -e

          echo "=========================================="
          echo "STEP 13-16 SOURCE CHECK"
          echo "=========================================="

          test -f src/13_prediction_archive.py

          test -f src/14_performance_tracker.py

          test -f src/15_accuracy_report.py

          test -f src/16_reliability_report.py

          test -f data/analysis/decision.csv

          test -f data/analysis/structure.csv

          test -f data/analysis/market_regime.csv

          test -f data/analysis/top20.csv

          echo ""
          echo "STEP 13 SOURCE : OK"
          echo "STEP 14 SOURCE : OK"
          echo "STEP 15 SOURCE : OK"
          echo "STEP 16 SOURCE : OK"
          echo ""
          echo "16_confidence_report.py : NOT USED"
          echo ""
          echo "ALL REQUIRED SOURCE FILES : OK"


      # ============================================================
      # 5. PYTHON SYNTAX CHECK
      # ============================================================

      - name: Python Syntax Check
        run: |

          set -e

          echo "=========================================="
          echo "PYTHON SYNTAX CHECK"
          echo "=========================================="

          python -m py_compile \
            src/13_prediction_archive.py

          python -m py_compile \
            src/14_performance_tracker.py

          python -m py_compile \
            src/15_accuracy_report.py

          python -m py_compile \
            src/16_reliability_report.py

          echo ""
          echo "PYTHON SYNTAX : OK"


      # ============================================================
      # 6. STEP 13
      #
      # 기존 FINAL REPORT의 신호를
      # 미래 성과 검증용으로 누적
      # ============================================================

      - name: Run STEP 13 Prediction Archive
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 13 - PREDICTION ARCHIVE"
          echo "=========================================="

          python src/13_prediction_archive.py


      # ============================================================
      # 7. STEP 13 VALIDATION
      # ============================================================

      - name: Validate STEP 13
        run: |

          set -e

          echo "=========================================="
          echo "STEP 13 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/prediction_history.csv

          python - <<'PY'

          import pandas as pd

          file = \
              "data/analysis/prediction_history.csv"

          df = pd.read_csv(file)

          print(
              "ROWS   :",
              len(df)
          )

          print(
              "TICKERS:",
              df["ticker"].nunique()
          )

          if "signal_price" in df.columns:

              print(
                  "PRICE  :",
                  df["signal_price"].notna().sum()
              )

              if df["signal_price"].isna().any():

                  raise RuntimeError(
                      "signal_price contains NaN"
                  )

          if df.empty:

              raise RuntimeError(
                  "prediction_history.csv empty"
              )

          print()
          print("STEP 13 OUTPUT : OK")

          PY


      # ============================================================
      # 8. STEP 14
      #
      # 실제 시장가격을 이용해서
      #
      # D1
      # D3
      # D5
      # MFE
      # MAE
      #
      # 를 계산
      # ============================================================

      - name: Run STEP 14 Performance Tracker
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 14 - PERFORMANCE TRACKER"
          echo "=========================================="

          python src/14_performance_tracker.py


      # ============================================================
      # 9. STEP 14 VALIDATION
      # ============================================================

      - name: Validate STEP 14
        run: |

          set -e

          echo "=========================================="
          echo "STEP 14 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/performance_history.csv

          python - <<'PY'

          import pandas as pd

          file = \
              "data/analysis/performance_history.csv"

          df = pd.read_csv(file)

          print(
              "ROWS :",
              len(df)
          )

          required_core = [
              "ticker",
              "decision",
          ]

          for column in required_core:

              if column not in df.columns:

                  raise RuntimeError(
                      f"Missing required column: {column}"
                  )

          print()

          for column in [
              "d1_return",
              "d3_return",
              "d5_return",
              "d5_mfe",
              "d5_mae",
          ]:

              if column in df.columns:

                  print(
                      column.upper(),
                      ":",
                      df[column].notna().sum()
                  )

          if df.empty:

              raise RuntimeError(
                  "performance_history.csv empty"
              )

          print()
          print("STEP 14 OUTPUT : OK")

          PY


      # ============================================================
      # 10. STEP 15
      #
      # 누적된 실제 결과를 이용해서
      # 정확도 통계 생성
      # ============================================================

      - name: Run STEP 15 Accuracy Report
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 15 - ACCURACY REPORT"
          echo "=========================================="

          python src/15_accuracy_report.py


      # ============================================================
      # 11. STEP 15 VALIDATION
      # ============================================================

      - name: Validate STEP 15
        run: |

          set -e

          echo "=========================================="
          echo "STEP 15 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/accuracy_report.csv

          python - <<'PY'

          import pandas as pd

          file = \
              "data/analysis/accuracy_report.csv"

          df = pd.read_csv(file)

          print(
              "REPORT ROWS :",
              len(df)
          )

          print()

          print(
              df.to_string(
                  index=False
              )
          )

          if df.empty:

              raise RuntimeError(
                  "accuracy_report.csv empty"
              )

          print()
          print("STEP 15 OUTPUT : OK")

          PY


      # ============================================================
      # 12. STEP 16
      #
      # ★ IMPORTANT
      #
      # 기존:
      #
      # 16_confidence_report.py
      #
      # 대신:
      #
      # 16_reliability_report.py
      #
      # 를 실행한다.
      #
      # 이 파일은:
      #
      # performance_history.csv
      # +
      # accuracy_report.csv
      #
      # 를 이용해서
      #
      # 실제 누적 검증 상태를 계산한다.
      # ============================================================

      - name: Run STEP 16 Reliability Report
        run: |

          set -e

          echo "=========================================="
          echo "🔥 STEP 16 - RELIABILITY REPORT"
          echo "=========================================="

          test -f \
            data/analysis/prediction_history.csv

          test -f \
            data/analysis/performance_history.csv

          test -f \
            data/analysis/accuracy_report.csv

          python src/16_reliability_report.py


      # ============================================================
      # 13. STEP 16 VALIDATION
      #
      # ★ reliability_report.csv
      # ★ reliability_report.md
      #
      # 두 결과 모두 확인
      # ============================================================

      - name: Validate STEP 16 Reliability
        run: |

          set -e

          echo "=========================================="
          echo "STEP 16 OUTPUT CHECK"
          echo "=========================================="

          test -f \
            data/analysis/reliability_report.csv

          test -f \
            data/analysis/reliability_report.md

          python - <<'PY'

          import pandas as pd
          from pathlib import Path

          csv_file = \
              "data/analysis/reliability_report.csv"

          md_file = \
              "data/analysis/reliability_report.md"

          df = pd.read_csv(csv_file)

          print()
          print("==========================================")
          print("🔥 RELIABILITY REPORT")
          print("==========================================")

          print()

          print(
              "ROWS :",
              len(df)
          )

          print()

          print(
              df.to_string(
                  index=False
              )
          )

          if df.empty:

              raise RuntimeError(
                  "reliability_report.csv empty"
              )

          if not Path(md_file).exists():

              raise RuntimeError(
                  "reliability_report.md missing"
              )

          print()
          print(
              "RELIABILITY CSV : OK"
          )

          print(
              "RELIABILITY MD  : OK"
          )

          print()
          print(
              "STEP 16 OUTPUT : OK"
          )

          PY


      # ============================================================
      # 14. DISPLAY RELIABILITY SUMMARY
      #
      # ★ 여기서 실제로 신뢰성이 얼마나 쌓였는지
      # GitHub Actions 로그에서 확인 가능
      # ============================================================

      - name: Display Reliability Summary
        run: |

          set -e

          python - <<'PY'

          import pandas as pd
          from pathlib import Path

          print()
          print("==========================================")
          print("🔥 OPTION SCANNER RELIABILITY SUMMARY")
          print("==========================================")

          files = {

              "Prediction History":
                  "data/analysis/prediction_history.csv",

              "Performance History":
                  "data/analysis/performance_history.csv",

              "Accuracy Report":
                  "data/analysis/accuracy_report.csv",

              "Reliability Report":
                  "data/analysis/reliability_report.csv",

          }

          for name, path in files.items():

              p = Path(path)

              if not p.exists():

                  print(
                      f"{name:<24}: MISSING"
                  )

                  continue

              try:

                  df = pd.read_csv(path)

                  print(
                      f"{name:<24}: "
                      f"{len(df)} rows"
                  )

              except Exception as e:

                  print(
                      f"{name:<24}: "
                      f"READ ERROR - {e}"
                  )


          # --------------------------------------------------------
          # RELIABILITY REPORT
          # --------------------------------------------------------

          reliability = pd.read_csv(
              "data/analysis/reliability_report.csv"
          )

          print()
          print("==========================================")
          print("📊 RELIABILITY RESULT")
          print("==========================================")

          print()

          print(
              reliability.to_string(
                  index=False
              )
          )


          # --------------------------------------------------------
          # LOOK FOR IMPORTANT METRICS
          # --------------------------------------------------------

          print()
          print("==========================================")
          print("📈 IMPORTANT RELIABILITY METRICS")
          print("==========================================")

          metric_column = None
          value_column = None

          if "metric" in reliability.columns:

              metric_column = "metric"

          if "value" in reliability.columns:

              value_column = "value"


          if (
              metric_column is not None
              and value_column is not None
          ):

              important = [
                  "total_signals",
                  "d5_completed",
                  "d5_hit_rate",
                  "d5_avg_return",
                  "d5_avg_mfe",
                  "d5_avg_mae",
                  "recent_50_count",
                  "recent_50_hit_rate",
                  "recent_50_avg_return",
              ]

              for metric in important:

                  rows = reliability[
                      reliability[metric_column]
                      .astype(str)
                      == metric
                  ]

                  if not rows.empty:

                      print(
                          f"{metric:<24}:",
                          rows.iloc[0][value_column]
                      )


          print()
          print("==========================================")
          print("🔥 RELIABILITY DATA IS ACCUMULATING")
          print("==========================================")

          PY


      # ============================================================
      # 15. COMMIT ACCURACY / RELIABILITY DATA
      #
      # 중요:
      #
      # prediction_history
      # performance_history
      # accuracy_report
      # reliability_report
      #
      # 모두 GitHub에 저장
      #
      # 다음 실행에서 다시 읽어서 누적 검증
      # ============================================================

      - name: Commit Accuracy and Reliability Data
        run: |

          set -e

          echo "=========================================="
          echo "COMMIT ACCURACY / RELIABILITY DATA"
          echo "=========================================="

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/analysis/prediction_history.csv \
            data/analysis/performance_history.csv \
            data/analysis/accuracy_report.csv \
            data/analysis/reliability_report.csv \
            data/analysis/reliability_report.md


          if git diff --cached --quiet; then

            echo "NO ACCURACY / RELIABILITY CHANGES"

          else

            git commit \
              -m "Update option scanner reliability data [skip ci]"

            echo "ACCURACY / RELIABILITY DATA COMMITTED"

          fi


      # ============================================================
      # 16. SYNC MAIN
      #
      # 다른 workflow가 main에 결과를 기록했을 경우
      # push 충돌 방지
      # ============================================================

      - name: Sync with Remote Main
        run: |

          set -e

          echo "=========================================="
          echo "SYNC WITH REMOTE MAIN"
          echo "=========================================="

          git fetch origin main

          if git diff --quiet HEAD origin/main; then

            echo "LOCAL MAIN IS UP TO DATE"

          else

            echo "REMOTE MAIN HAS NEW COMMITS"

            git rebase origin/main

          fi

          echo "SYNC : OK"


      # ============================================================
      # 17. PUSH
      # ============================================================

      - name: Push Accuracy and Reliability Data
        run: |

          set -e

          echo "=========================================="
          echo "PUSH ACCURACY / RELIABILITY DATA"
          echo "=========================================="

          git push origin HEAD:main

          echo "PUSH : OK"


      # ============================================================
      # 18. COMPLETE
      # ============================================================

      - name: Accuracy Pipeline Complete
        run: |

          echo ""
          echo "=========================================="
          echo "🔥🔥 STEP 13-16 COMPLETE"
          echo "=========================================="

          echo ""
          echo "STEP 13 : Prediction Archive"
          echo "STEP 14 : Performance Tracker"
          echo "STEP 15 : Accuracy Report"
          echo "STEP 16 : Reliability Report"

          echo ""
          echo "prediction_history.csv  : SAVED"
          echo "performance_history.csv : SAVED"
          echo "accuracy_report.csv     : SAVED"
          echo "reliability_report.csv  : SAVED"
          echo "reliability_report.md   : SAVED"

          echo ""
          echo "16_confidence_report.py : NOT USED"

          echo ""
          echo "=========================================="
          echo "🔥 RELIABILITY DATA : ACCUMULATING"
          echo "=========================================="
