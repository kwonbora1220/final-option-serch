
name: STEP 12 - Telegram Report

on:
  workflow_dispatch:

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: STEP 12 File Check and Telegram Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=========================================="
          echo "STEP 12 FILE CHECK"
          echo "=========================================="

          pwd

          echo "--- FILE ---"
          ls -lh src/12_telegram.py

          echo "--- FIRST 20 LINES ---"
          sed -n '1,20p' src/12_telegram.py

          echo "--- PYTHON RUN ---"
          python -u src/12_telegram.py

          echo "=========================================="
          echo "STEP 12 FINISHED"
          echo "=========================================="
