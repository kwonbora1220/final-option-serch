
      - name: Run STEP 12 Telegram Reporter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=========================================="
          echo "STEP 12 FILE CHECK"
          echo "=========================================="

          pwd

          echo "--- FILE ---"
          ls -lh src/12_telegram.py

          echo "--- FIRST 20 LINES ---"
          sed -n '1,20p' src/12_telegram.py

          echo "--- PYTHON RUN ---"
          python -u src/12_telegram.py

          echo "=========================================="
          echo "STEP 12 FINISHED"
          echo "=========================================="

