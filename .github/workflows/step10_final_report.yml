name: STEP 10 - Final Report

on:
  workflow_dispatch:

jobs:
  final-report:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: STEP 10 Input Check
        run: |

          echo "=========================================="
          echo "STEP 10 INPUT CHECK"
          echo "=========================================="

          test -f data/analysis/decision.csv

          echo "DECISION FILE : OK"

          ls -lh data/analysis/decision.csv

      - name: Run STEP 10 Final Report
        run: |

          echo "=========================================="
          echo "STEP 10 FINAL REPORT"
          echo "=========================================="

          python src/10_final_report.py

      - name: STEP 10 Output Check
        run: |

          echo "=========================================="
          echo "STEP 10 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/final_report.csv
          test -f data/analysis/final_report.md

          echo "FINAL REPORT FILES : OK"

          echo ""
          echo "CSV:"
          ls -lh data/analysis/final_report.csv

          echo ""
          echo "MARKDOWN:"
          ls -lh data/analysis/final_report.md

          python - <<'PY'
          import pandas as pd

          csv_file = "data/analysis/final_report.csv"

          df = pd.read_csv(csv_file)

          print()
          print("ROWS              :", len(df))
          print("TICKERS           :", df["ticker"].nunique())
          print(
              "DECISION SCORE    :",
              df["decision_score"].notna().sum()
          )
          print(
              "DECISION VALID    :",
              df["decision"].notna().sum()
          )

          print()
          print("DECISION SUMMARY")
          print("----------------------------------------")

          print(
              df["decision"]
              .value_counts()
              .to_string()
          )

          print()
          print("FINAL REPORT : OK")
          PY

      - name: Save STEP 10 result to GitHub
        run: |

          echo "=========================================="
          echo "SAVE STEP 10 RESULT"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/analysis/final_report.csv \
            data/analysis/final_report.md

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Add STEP 10 final report"

            echo "PUSH ATTEMPT : 1"

            git pull --rebase origin main

            git push

            echo "PUSH SUCCESS"

          fi

      - name: STEP 10 Complete
        run: |

          echo "=========================================="
          echo "🔥 STEP 10 FINAL REPORT COMPLETE"
          echo "=========================================="

          echo "CSV:"
          echo "data/analysis/final_report.csv"

          echo ""
          echo "MARKDOWN:"
          echo "data/analysis/final_report.md"

          echo ""
          echo "STEP 10 STATUS : SUCCESS"
