
name: STEP 10 - Final Report

on:
  workflow_dispatch:

jobs:
  final-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: STEP 10 Input Check
        run: |
          echo "=========================================="
          echo "STEP 10 INPUT CHECK"
          echo "=========================================="

          test -f data/analysis/structure.csv
          test -f data/analysis/unusual_flow.csv
          test -f data/analysis/top20.csv
          test -f data/analysis/option_search.csv
          test -f data/analysis/options_greeks.csv
          test -f data/analysis/decision.csv

          echo ""
          echo "REQUIRED FILES : OK"
          echo ""

          ls -lh \
            data/analysis/structure.csv \
            data/analysis/unusual_flow.csv \
            data/analysis/top20.csv \
            data/analysis/option_search.csv \
            data/analysis/options_greeks.csv \
            data/analysis/decision.csv

      - name: Run STEP 10 Final Report
        run: |
          echo "=========================================="
          echo "STEP 10 FINAL REPORT"
          echo "=========================================="

          python src/10_final_report.py

      - name: STEP 10 Output Check
        run: |
          echo "=========================================="
          echo "STEP 10 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/final_report.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/final_report.csv"

          df = pd.read_csv(file)

          print(f"ROWS             : {len(df)}")
          print(f"TICKERS          : {df['ticker'].nunique()}")

          print()
          print("FINAL DECISION COUNTS")
          print("------------------------------------------")

          if "final_decision" in df.columns:
              print(df["final_decision"].value_counts())
          elif "decision" in df.columns:
              print(df["decision"].value_counts())
          else:
              print("Decision column not found")

          print()
          print("STEP 10 OUTPUT : OK")
          print("==========================================")
          PY

      - name: Save STEP 10 result to GitHub
        run: |
          echo "=========================================="
          echo "SAVE STEP 10 RESULT"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/analysis/final_report.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add STEP 10 final report"
            git push
          fi

      - name: STEP 10 Complete
        run: |
          echo "=========================================="
          echo "🔥 STEP 10 FINAL REPORT COMPLETE"
          echo "=========================================="

          echo "final_report.csv saved to:"
          echo "data/analysis/final_report.csv"

