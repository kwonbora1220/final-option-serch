
name: STEP 8 - Option Structure

on:
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check STEP 8 inputs
        run: |
          echo "=========================================="
          echo "STEP 8 INPUT CHECK"
          echo "=========================================="

          ls -lh data/analysis/

          test -f data/analysis/options_greeks.csv
          test -f data/analysis/top20.csv

          echo "INPUT FILES : OK"

      - name: Run Option Structure
        run: |
          python src/08_structure.py

      - name: Check STEP 8 output
        run: |
          echo "=========================================="
          echo "STEP 8 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/structure.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/structure.csv"

          df = pd.read_csv(file)

          print(f"ROWS             : {len(df)}")
          print(f"TICKERS          : {df['ticker'].nunique()}")

          print(
              "CALL WALL VALID   :",
              df["call_wall"].notna().sum()
          )

          print(
              "PUT WALL VALID    :",
              df["put_wall"].notna().sum()
          )

          print(
              "NET GEX VALID     :",
              df["net_gex"].notna().sum()
          )

          print(
              "STRUCTURE VALID   :",
              df["structure"].notna().sum()
          )

          print("STEP 8 OUTPUT : OK")
          PY

      - name: Upload STEP 8 structure
        uses: actions/upload-artifact@v4
        with:
          name: option-structure
          path: data/analysis/structure.csv

