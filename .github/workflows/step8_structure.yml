
name: STEP 8 - Structure Analysis

on:
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: STEP 8 Input Check
        run: |
          echo "=========================================="
          echo "STEP 8 INPUT CHECK"
          echo "=========================================="

          test -f data/analysis/options_greeks.csv
          test -f data/analysis/top20.csv
          test -f data/analysis/option_search.csv
          test -f data/analysis/unusual_flow.csv

          echo "INPUT FILES : OK"

          ls -lh data/analysis/

      - name: Run STEP 8 Structure Analysis
        run: |
          python src/08_structure.py

      - name: STEP 8 Output Check
        run: |
          echo "=========================================="
          echo "STEP 8 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/structure.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/structure.csv"

          df = pd.read_csv(file)

          print(f"ROWS             : {len(df)}")
          print(f"TICKERS          : {df['ticker'].nunique()}")

          print(
              f"CALL WALL VALID   : "
              f"{df['call_wall'].notna().sum()}"
          )

          print(
              f"PUT WALL VALID    : "
              f"{df['put_wall'].notna().sum()}"
          )

          print(
              f"NET GEX VALID     : "
              f"{df['net_gex'].notna().sum()}"
          )

          print(
              f"STRUCTURE VALID   : "
              f"{df['structure'].notna().sum()}"
          )

          print()
          print("STEP 8 OUTPUT : OK")
          PY

      - name: Save STEP 8 result to GitHub
        run: |
          echo "=========================================="
          echo "SAVE STEP 8 RESULT"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/analysis/structure.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add STEP 8 structure analysis"
            git push
          fi

      - name: STEP 8 Complete
        run: |
          echo "=========================================="
          echo "🔥 STEP 8 STRUCTURE COMPLETE"
          echo "=========================================="
          echo "structure.csv saved to GitHub:"
          echo "data/analysis/structure.csv"
