name: STEP 6 - Top 20 Selection

on:
  workflow_dispatch:

concurrency:
  group: option-scanner-main-writer
  cancel-in-progress: false

jobs:
  top20:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check STEP 5 Input
        run: |
          echo "=========================================="
          echo "STEP 5 INPUT CHECK"
          echo "=========================================="

          test -f data/analysis/unusual_flow.csv

          ls -lh data/analysis/unusual_flow.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/unusual_flow.csv"

          df = pd.read_csv(file)

          print("ROWS       :", len(df))
          print("COLUMNS    :", len(df.columns))
          print("TICKERS    :", df["symbol"].nunique())
          print("FLOW SCORE :", df["flow_score"].notna().sum())
          print("DTE MIN    :", df["DTE"].min())
          print("DTE MAX    :", df["DTE"].max())
          PY

      - name: Run TOP 20 Engine
        run: |
          echo "=========================================="
          echo "RUN STEP 6 TOP 20"
          echo "=========================================="

          python src/06_top20.py

      - name: Check TOP 20 Output
        run: |
          echo "=========================================="
          echo "STEP 6 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/top20.csv

          ls -lh data/analysis/top20.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/top20.csv"

          df = pd.read_csv(file)

          print("TOP20 ROWS :", len(df))
          print("TICKERS    :", df["symbol"].nunique())
          print("RANK MIN   :", df["rank"].min())
          print("RANK MAX   :", df["rank"].max())

          print()
          print("==========================================")
          print("TOP 20")
          print("==========================================")

          print(
              df[
                  [
                      "rank",
                      "symbol",
                      "top20_score",
                      "max_flow_score",
                      "total_premium",
                      "call_put_imbalance",
                      "estimated_direction",
                  ]
              ].to_string(index=False)
          )

          if len(df) != 20:
              raise RuntimeError(
                  f"TOP 20 validation failed: {len(df)} rows"
              )

          if df["symbol"].nunique() != 20:
              raise RuntimeError(
                  "TOP 20 contains duplicate symbols."
              )

          print()
          print("TOP20 CHECK : OK")
          PY

      - name: Save TOP 20 To Repository
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/analysis/top20.csv

          if git diff --cached --quiet; then
            echo "NO CHANGES TO COMMIT"
            exit 0
          fi

          git commit -m "Update top 20 unusual option flow"

          echo "=========================================="
          echo "SYNC WITH REMOTE MAIN"
          echo "=========================================="

          git fetch origin main

          git rebase origin/main

          echo "=========================================="
          echo "PUSHING STEP 6 DATA"
          echo "=========================================="

          git push origin HEAD:main

      - name: Upload TOP 20 Data
        uses: actions/upload-artifact@v4
        with:
          name: top20-data
          path: data/analysis/top20.csv
