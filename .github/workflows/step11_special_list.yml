name: STEP 11 - SPECIAL LIST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  special-list:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. INSTALL
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      # ============================================================
      # 4. CHECK INPUT FILES
      # ============================================================

      - name: Check STEP 11 input files
        run: |
          echo "=============================================="
          echo "STEP 11 INPUT FILE CHECK"
          echo "=============================================="

          echo ""
          echo "[CHECK] final_report.csv"
          test -f data/analysis/final_report.csv
          ls -lh data/analysis/final_report.csv

          echo ""
          echo "[CHECK] unusual_flow.csv"
          test -f data/analysis/unusual_flow.csv
          ls -lh data/analysis/unusual_flow.csv

          echo ""
          echo "[CHECK] option_search.csv"
          test -f data/analysis/option_search.csv
          ls -lh data/analysis/option_search.csv

          echo ""
          echo "[CHECK] structure.csv"
          test -f data/analysis/structure.csv
          ls -lh data/analysis/structure.csv

          echo ""
          echo "INPUT FILE CHECK COMPLETE"

      # ============================================================
      # 5. SHOW FILE STRUCTURE
      # ============================================================

      - name: Show analysis directory
        run: |
          echo "=============================================="
          echo "DATA / ANALYSIS"
          echo "=============================================="

          find data/analysis -maxdepth 1 -type f -print | sort

      # ============================================================
      # 6. RUN STEP 11
      # ============================================================

      - name: Run STEP 11 SPECIAL LIST
        run: |
          echo "=============================================="
          echo "RUNNING STEP 11 SPECIAL LIST"
          echo "=============================================="

          python 02_PROGRAM/11_special_list.py

      # ============================================================
      # 7. VALIDATE OUTPUT
      # ============================================================

      - name: Validate SPECIAL LIST
        run: |
          echo "=============================================="
          echo "STEP 11 OUTPUT VALIDATION"
          echo "=============================================="

          test -f data/analysis/special_list.csv

          echo ""
          echo "SPECIAL LIST FILE:"
          ls -lh data/analysis/special_list.csv

          echo ""
          echo "SPECIAL LIST CONTENT:"
          cat data/analysis/special_list.csv

          echo ""
          echo "STEP 11 OUTPUT VALIDATION COMPLETE"

      # ============================================================
      # 8. COMMIT RESULT
      # ============================================================

      - name: Commit SPECIAL LIST
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/analysis/special_list.csv

          if git diff --cached --quiet; then
            echo "No changes to special_list.csv"
          else
            git commit -m "Add STEP 11 special list"
            git push
          fi
