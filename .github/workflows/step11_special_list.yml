
name: STEP 11 - Special List

on:
  workflow_dispatch:

jobs:
  special-list:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # INPUT CHECK
      # ============================================================

      - name: STEP 11 Input Check
        run: |

          echo "=========================================="
          echo "STEP 11 INPUT CHECK"
          echo "=========================================="

          test -f data/analysis/unusual_flow.csv

          echo "UNUSUAL FLOW : OK"

          ls -lh data/analysis/unusual_flow.csv

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/unusual_flow.csv"

          df = pd.read_csv(file)

          print()
          print("ROWS        :", len(df))
          print("COLUMNS     :", len(df.columns))
          print("TICKERS     :", df["symbol"].nunique())

          if "trade_side_estimate" in df.columns:

              print(
                  "BUY EST.    :",
                  (
                      df["trade_side_estimate"]
                      .astype(str)
                      .str.upper()
                      .eq("BUY EST.")
                  ).sum()
              )

              print(
                  "SELL EST.   :",
                  (
                      df["trade_side_estimate"]
                      .astype(str)
                      .str.upper()
                      .eq("SELL EST.")
                  ).sum()
              )

          print()
          print("STEP 5 DATA : READY")
          PY


      # ============================================================
      # RUN STEP 11
      # ============================================================

      - name: Run STEP 11 Special List
        run: |

          echo "=========================================="
          echo "STEP 11 SPECIAL LIST"
          echo "=========================================="

          python src/11_special_list.py


      # ============================================================
      # OUTPUT CHECK
      # ============================================================

      - name: STEP 11 Output Check
        run: |

          echo "=========================================="
          echo "STEP 11 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/special_list.csv
          test -f data/analysis/special_list.md

          echo "SPECIAL LIST FILES : OK"

          echo ""
          echo "CSV:"
          ls -lh data/analysis/special_list.csv

          echo ""
          echo "MARKDOWN:"
          ls -lh data/analysis/special_list.md


          python - <<'PY'
          import pandas as pd

          csv_file = "data/analysis/special_list.csv"

          df = pd.read_csv(csv_file)

          print()
          print("ROWS              :", len(df))
          print("TICKERS           :", df["ticker"].nunique())
          print(
              "SPECIAL SCORE     :",
              df["special_score"].notna().sum()
          )

          print(
              "STRUCTURE VALID   :",
              (
                  df["structure"]
                  .astype(str)
                  .str.contains(
                      "CALL BUY + PUT SELL",
                      regex=False
                  )
                  .sum()
              )
          )

          print()

          if len(df) == 0:

              print(
                  "SPECIAL LIST      : 0"
              )

              print(
                  "NO CALL BUY + PUT SELL STRUCTURE"
              )

          else:

              print(
                  "SPECIAL LIST PREVIEW"
              )

              print(
                  "----------------------------------------"
              )

              columns = [
                  "special_rank",
                  "ticker",
                  "special_score",
                  "current_price",
                  "call_strike",
                  "put_strike",
                  "call_DTE",
                  "put_DTE",
                  "structure",
              ]

              print(
                  df[columns]
                  .to_string(index=False)
              )

          print()
          print("STEP 11 OUTPUT : OK")
          PY


      # ============================================================
      # SAVE
      # ============================================================

      - name: Save STEP 11 result to GitHub
        run: |

          echo "=========================================="
          echo "SAVE STEP 11 RESULT"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/analysis/special_list.csv \
            data/analysis/special_list.md

          if git diff --cached --quiet; then

            echo "NO CHANGES TO COMMIT"

          else

            git commit \
              -m "Add STEP 11 special list"

            echo "PUSH ATTEMPT : 1"

            git fetch origin main

            git rebase origin/main

            git push origin HEAD:main

            echo "PUSH SUCCESS"

          fi


      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload STEP 11 result
        uses: actions/upload-artifact@v4
        with:
          name: special-list-data
          path: |
            data/analysis/special_list.csv
            data/analysis/special_list.md


      # ============================================================
      # COMPLETE
      # ============================================================

      - name: STEP 11 Complete
        run: |

          echo "=========================================="
          echo "🔥 STEP 11 SPECIAL LIST COMPLETE"
          echo "=========================================="

          echo ""
          echo "CSV:"
          echo "data/analysis/special_list.csv"

          echo ""
          echo "MARKDOWN:"
          echo "data/analysis/special_list.md"

          echo ""
          echo "SPECIAL STRUCTURE:"
          echo "CALL BUY + PUT SELL"

          echo ""
          echo "INPUT:"
          echo "data/analysis/unusual_flow.csv"

          echo ""
          echo "STEP 11 STATUS : SUCCESS"

