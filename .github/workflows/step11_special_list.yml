name: STEP 11 - Special List

on:
  workflow_dispatch:

jobs:
  special-list:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: STEP 11 Input Check
        run: |

          echo "=========================================="
          echo "STEP 11 INPUT CHECK"
          echo "=========================================="

          test -f data/analysis/unusual_flow.csv
          test -f data/analysis/decision.csv

          test -f src/11_special_list.py

          echo "UNUSUAL FLOW : OK"
          echo "DECISION     : OK"
          echo "PROGRAM      : OK"

          ls -lh \
            data/analysis/unusual_flow.csv \
            data/analysis/decision.csv \
            src/11_special_list.py

      - name: Run STEP 11 Special List
        run: |

          echo "=========================================="
          echo "STEP 11 SPECIAL LIST"
          echo "=========================================="

          python src/11_special_list.py

      - name: STEP 11 Output Check
        run: |

          echo "=========================================="
          echo "STEP 11 OUTPUT CHECK"
          echo "=========================================="

          test -f data/analysis/special_list.csv
          test -f data/analysis/special_list.md

          echo "SPECIAL LIST FILES : OK"

          echo ""
          echo "CSV:"
          ls -lh data/analysis/special_list.csv

          echo ""
          echo "MARKDOWN:"
          ls -lh data/analysis/special_list.md

          python - <<'PY'
          import pandas as pd

          file = "data/analysis/special_list.csv"

          df = pd.read_csv(file)

          print()
          print("ROWS                  :", len(df))

          if len(df) > 0:

              print(
                  "TICKERS               :",
                  df["ticker"].nunique()
              )

              print(
                  "CALL BUY VALID        :",
                  (df["call_buy_count"] > 0).sum()
              )

              print(
                  "PUT SELL VALID        :",
                  (df["put_sell_count"] > 0).sum()
              )

              print(
                  "STRUCTURE VALID       :",
                  (
                      df["structure"]
                      == "CALL BUY + PUT SELL"
                  ).sum()
              )

              print()
              print("SPECIAL LIST")
              print("----------------------------------------")

              print(
                  df[
                      [
                          "special_rank",
                          "ticker",
                          "call_buy_count",
                          "put_sell_count",
                          "call_buy_volume",
                          "put_sell_volume",
                          "decision"
                      ]
                  ].to_string(index=False)
              )

          else:

              print("NO CALL BUY + PUT SELL STRUCTURE FOUND")

          print()
          print("STEP 11 OUTPUT : OK")
          PY

      - name: Save STEP 11 result to GitHub
        run: |

          echo "=========================================="
          echo "SAVE STEP 11 RESULT"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/analysis/special_list.csv \
            data/analysis/special_list.md

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Add STEP 11 special list"

            echo "PUSH ATTEMPT : 1"

            git pull --rebase origin main

            git push

            echo "PUSH SUCCESS"

          fi

      - name: STEP 11 Complete
        run: |

          echo "=========================================="
          echo "🔥 STEP 11 SPECIAL LIST COMPLETE"
          echo "=========================================="

          echo "CSV:"
          echo "data/analysis/special_list.csv"

          echo ""
          echo "MARKDOWN:"
          echo "data/analysis/special_list.md"

          echo ""
          echo "STRUCTURE:"
          echo "CALL BUY + PUT SELL"

          echo ""
          echo "STEP 11 STATUS : SUCCESS"
